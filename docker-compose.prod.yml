services:
  vibe-trading:
    image: ghcr.io/crazyskinny/vibe-trading:${VIBE_TRADING_IMAGE_TAG:-latest}
    pull_policy: always
    ports:
      - "${VIBE_TRADING_BIND:-127.0.0.1}:${VIBE_TRADING_PORT:-8899}:8899"
    env_file:
      - ./agent/.env
    environment:
      VIBE_TRADING_TRUST_DOCKER_LOOPBACK: "1"
    volumes:
      - vibe-runs:/app/agent/runs
      - vibe-sessions:/app/agent/sessions
      - vibe-home:/home/vibe
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8899/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  vibe-runs:
  vibe-sessions:
  vibe-home:
